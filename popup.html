<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Maps Scraper</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --success-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 360px;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #60a5fa;
    }

    .badge {
      font-size: 10px;
      background: #1e3a8a;
      color: #93c5fd;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .setting-row:last-child {
      margin-bottom: 0;
    }

    label {
      color: var(--text-muted);
      font-size: 12px;
    }

    input[type="number"] {
      width: 70px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      text-align: right;
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 2px;
    }

    .status-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 12px;
      min-height: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger-hover);
    }

    .btn-view {
      background: #0284c7;
      color: #fff;
    }

    .btn-view:hover:not(:disabled) {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <img src="icons/icon32.png" alt="Logo" width="22" height="22" style="border-radius: 4px;">
      <h1>XMaps Scraper</h1>
    </div>
    <span class="badge">MV3</span>
  </div>

  <div class="card">
    <div class="setting-row">
      <label for="maxResults">Maks. Target Data:</label>
      <input type="number" id="maxResults" value="50" min="1" max="1000">
    </div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-label">Terekstrak</div>
      <div class="stat-value" id="countScraped">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Status</div>
      <div class="stat-value" id="statusState" style="font-size: 13px; margin-top: 5px; color: #a3e635;">Siap</div>
    </div>
  </div>

  <div class="status-text" id="statusMessage">Buka hasil pencarian Google Maps lalu klik Start.</div>

  <div class="btn-group">
    <button id="btnStart" class="btn-primary">▶ Mulai Scraping</button>
    <button id="btnStop" class="btn-danger" style="display: none;">⏹ Berhenti</button>
    <button id="btnView" class="btn-view" disabled>👁️ Buka Data di Browser</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
